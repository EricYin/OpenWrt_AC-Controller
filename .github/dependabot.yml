version: 2
updates:
  # Go 模块：modernc.org/sqlite 与 x/sys 的安全和兼容更新。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions 版本（checkout / setup-go / buildx / qemu 等）。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # 基础镜像标签（golang / alpine）。只提 PR，不会自动合并。
  - package-ecosystem: docker
    directory: /controller
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
