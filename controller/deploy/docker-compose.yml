# AC 控制器部署编排（amd64 / arm64 通用，镜像来自 Docker Hub）。
# 启动后在 AC 网页「AP 管理」生成共享密钥。
# 只保留部署必需项；其余变量用内置默认值，NTP / 共享密钥可在「系统配置」页修改。
# network_mode: host 为必需：AP 发现是 UDP 广播，bridge 网络收不到。
# 升级：docker compose pull && docker compose up -d
# 镜像跟随 latest（main 分支 CI 每次推送都会更新它）；pull_policy: always 让
# 直接 `docker compose up -d` 也先拉取，不必记两条命令。容器重启不会触发拉取，
# 所以断网时已有镜像照常运行。
services:
  ac:
    image: naoki66/openwrt_ac-controller:latest
    pull_policy: always
    container_name: ac-controller
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      AC_SHARED_SECRET: "${AC_SHARED_SECRET:-}"
      AC_ADMIN_USER: "admin"
      AC_ADMIN_PASSWORD: "${AC_ADMIN_PASSWORD:-}"
    volumes:
      - ./data:/var/lib/ac
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
